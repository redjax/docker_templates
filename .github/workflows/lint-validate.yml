---
name: Lint and validate

on:
  workflow_call:
    inputs:
      lint_yaml:
        description: Run yamllint.
        required: false
        type: boolean
        default: true

      lint_compose:
        description: Run Docker Compose configuration validation.
        required: false
        type: boolean
        default: true

      lint_dockerfiles:
        description: Run hadolint.
        required: false
        type: boolean
        default: true

      lint_python:
        description: Run Ruff lint and formatting checks.
        required: false
        type: boolean
        default: true

      lint_bash:
        description: Run ShellCheck.
        required: false
        type: boolean
        default: true

      verbose:
        description: Print failed files and detailed tool output.
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      lint_yaml:
        description: Run yamllint.
        required: false
        type: boolean
        default: true

      lint_compose:
        description: Run Docker Compose configuration validation.
        required: false
        type: boolean
        default: true

      lint_dockerfiles:
        description: Run hadolint.
        required: false
        type: boolean
        default: true

      lint_python:
        description: Run Ruff lint and formatting checks.
        required: false
        type: boolean
        default: true

      lint_bash:
        description: Run ShellCheck.
        required: false
        type: boolean
        default: true

      verbose:
        description: Print failed files and detailed tool output.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Run selected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      LINT_YAML: ${{ inputs.lint_yaml }}
      LINT_COMPOSE: ${{ inputs.lint_compose }}
      LINT_DOCKERFILES: ${{ inputs.lint_dockerfiles }}
      LINT_PYTHON: ${{ inputs.lint_python }}
      LINT_BASH: ${{ inputs.lint_bash }}
      VERBOSE_INPUT: ${{ inputs.verbose }}

      COMPOSE_VALIDATE_JOBS: "4"

      # renovate: datasource=python-version depName=python versioning=python
      PYTHON_VERSION: "3.14"

      # renovate: datasource=pypi depName=yamllint
      YAMLLINT_VERSION: "1.35.1"

      # renovate: datasource=github-releases depName=hadolint/hadolint
      HADOLINT_VERSION: "2.12.0"

      # renovate: datasource=pypi depName=ruff
      RUFF_VERSION: "0.17.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ inputs.lint_yaml || inputs.lint_python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        if: ${{ inputs.lint_yaml }}
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --quiet \
            "yamllint==${YAMLLINT_VERSION}"

      - name: Install Ruff
        if: ${{ inputs.lint_python }}
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --quiet \
            "ruff==${RUFF_VERSION}"

      - name: Install hadolint
        if: ${{ inputs.lint_dockerfiles }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/lint-bin"

          curl --fail --silent --show-error --location \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            --output "${RUNNER_TEMP}/lint-bin/hadolint"

          chmod +x "${RUNNER_TEMP}/lint-bin/hadolint"
          echo "${RUNNER_TEMP}/lint-bin" >> "${GITHUB_PATH}"

      - name: Ensure ShellCheck is available
        if: ${{ inputs.lint_bash }}
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi

      - name: Check Docker Compose
        if: ${{ inputs.lint_compose }}
        shell: bash
        run: docker compose version

      - name: Run linters and validators
        shell: bash
        run: |
          args=()

          if [[ "${VERBOSE_INPUT}" == true ]]; then
            args+=(--verbose)
          fi

          bash ./scripts/lint/run-all.sh "${args[@]}"

      - name: Upload lint and validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-validation-reports
          path: output/lint-results/
          if-no-files-found: warn
          retention-days: 14
