---
name: Lint and validate

on:
  workflow_call:
    inputs:
      lint_yaml:
        description: Run yamllint.
        required: false
        type: boolean
        default: true

      lint_compose:
        description: Run Docker Compose configuration validation.
        required: false
        type: boolean
        default: true

      lint_dockerfiles:
        description: Run hadolint.
        required: false
        type: boolean
        default: true

      lint_python:
        description: Run Ruff lint and formatting checks.
        required: false
        type: boolean
        default: true

      lint_bash:
        description: Run ShellCheck.
        required: false
        type: boolean
        default: true

      verbose:
        description: Print failed files and detailed tool output.
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      lint_yaml:
        description: Run yamllint.
        required: false
        type: boolean
        default: true

      lint_compose:
        description: Run Docker Compose configuration validation.
        required: false
        type: boolean
        default: true

      lint_dockerfiles:
        description: Run hadolint.
        required: false
        type: boolean
        default: true

      lint_python:
        description: Run Ruff lint and formatting checks.
        required: false
        type: boolean
        default: true

      lint_bash:
        description: Run ShellCheck.
        required: false
        type: boolean
        default: true

      verbose:
        description: Print failed files and detailed tool output.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERBOSE_INPUT: ${{ inputs.verbose }}

  COMPOSE_VALIDATE_JOBS: "4"

  # renovate: datasource=python-version depName=python versioning=python
  PYTHON_VERSION: "3.14"

  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: "1.35.1"

  # renovate: datasource=github-releases depName=hadolint/hadolint
  HADOLINT_VERSION: "2.12.0"

  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: "0.17.1"

defaults:
  run:
    shell: bash

jobs:
  yaml:
    name: YAML / yamllint
    if: ${{ inputs.lint_yaml }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --quiet \
            "yamllint==${YAMLLINT_VERSION}"

      - name: Lint YAML
        run: |
          output_file="$(mktemp)"
          trap 'rm -f -- "${output_file}"' EXIT

          status=0
          bash ./scripts/lint/lint-yaml.sh \
            >"${output_file}" 2>&1 || status=$?

          if [[ "${VERBOSE_INPUT}" == true ]] || ((status > 1)); then
            cat "${output_file}"
          else
            awk '/^Files checked: [0-9]+$/ || /^Files with failures: [0-9]+$/' \
              "${output_file}"

            if ! grep -Eq '^Files with failures: [0-9]+$' "${output_file}"; then
              cat "${output_file}"
              exit 2
            fi
          fi

          exit "${status}"

      - name: Upload YAML reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-yaml-reports
          path: |
            output/lint-results/yamllint.txt
            output/lint-results/yamllint-detailed.txt
          if-no-files-found: warn
          retention-days: 14

  compose:
    name: Docker Compose / config validation
    if: ${{ inputs.lint_compose }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Docker Compose
        run: docker compose version

      - name: Validate Docker Compose
        run: |
          output_file="$(mktemp)"
          trap 'rm -f -- "${output_file}"' EXIT

          status=0
          bash ./scripts/lint/validate-compose.sh \
            >"${output_file}" 2>&1 || status=$?

          if [[ "${VERBOSE_INPUT}" == true ]] || ((status > 1)); then
            cat "${output_file}"
          else
            awk '/^Files checked: [0-9]+$/ || /^Files with failures: [0-9]+$/' \
              "${output_file}"

            if ! grep -Eq '^Files with failures: [0-9]+$' "${output_file}"; then
              cat "${output_file}"
              exit 2
            fi
          fi

          exit "${status}"

      - name: Upload Docker Compose reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-compose-reports
          path: |
            output/lint-results/compose-config.txt
            output/lint-results/compose-config-detailed.txt
          if-no-files-found: warn
          retention-days: 14

  dockerfiles:
    name: Dockerfiles / hadolint
    if: ${{ inputs.lint_dockerfiles }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          mkdir -p "${RUNNER_TEMP}/lint-bin"

          curl --fail --silent --show-error --location \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            --output "${RUNNER_TEMP}/lint-bin/hadolint"

          chmod +x "${RUNNER_TEMP}/lint-bin/hadolint"
          echo "${RUNNER_TEMP}/lint-bin" >> "${GITHUB_PATH}"

      - name: Lint Dockerfiles
        run: |
          output_file="$(mktemp)"
          trap 'rm -f -- "${output_file}"' EXIT

          status=0
          bash ./scripts/lint/lint-dockerfiles.sh \
            >"${output_file}" 2>&1 || status=$?

          if [[ "${VERBOSE_INPUT}" == true ]] || ((status > 1)); then
            cat "${output_file}"
          else
            awk '/^Files checked: [0-9]+$/ || /^Files with failures: [0-9]+$/' \
              "${output_file}"

            if ! grep -Eq '^Files with failures: [0-9]+$' "${output_file}"; then
              cat "${output_file}"
              exit 2
            fi
