---
name: PR checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".yamllint"
      - ".yamllint.yml"
      - ".yamllint.yaml"
      - ".hadolint.yaml"
      - ".hadolint.yml"
      - ".shellcheckrc"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    uses: ./.github/workflows/lint-validate.yml
    with:
      lint_yaml: false
      lint_compose: false
      lint_dockerfiles: false
      lint_python: false
      lint_bash: true
      verbose: false
