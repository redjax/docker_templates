###################################################################
# Anyone can browse/download                                      #                             
#                                                                 #
# Only authenticated users can modify the files.                  #
#                                                                 #
# IMPORTANT:                                                      #
# Change these example passwords before using this configuration. #
###################################################################

[global]

## Enable the file indexer and filesystem scanning.
e2dsa

## Index audio/video metadata.
e2ts


[accounts]

## username: password

alice: change-this-password
bob: change-this-password
admin: change-this-password


[/]

/w

accs:
  ## Everyone can browse and download.
  r: *

  ## Alice and Bob can read, write, move and delete.
  rwmd: alice, bob

  ## Admin gets capabilities like seeing uploader IPs and reloading the configuration.
  rwmda: admin

flags:
  ## Enable filesystem scanning.
  e2ds
