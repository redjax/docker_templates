#########################################
# Public read-only file server          #
#                                       #
# Anyone can browse and download files. #
# Nobody can upload or modify anything. #
#########################################

[global]

## Enable the file indexer and filesystem scanning.
e2dsa

## Index audio/video metadata.
e2ts


[/]

/w

accs:
  ## Everyone gets read-only access.
  r: *

flags:

  ## Enable filesystem scanning.
  e2ds
