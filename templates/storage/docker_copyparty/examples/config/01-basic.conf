############################################################
# Simple shared folder                                     #
# Anyone who can reach Copyparty can read and write files. #
############################################################

[global]

## Enable the file indexer and filesystem scanning.
e2dsa

## Index audio/video metadata.
e2ts


[/]

## Docker volume mounted by compose.yml
/w

accs:
  ## Everyone gets read/write access.
  rw: *

flags:
  ## Enable filesystem scanning for this volume.
  e2ds
