###############################################
# Multiple users, groups, public read access, #
# private/admin access, and separate volumes. #
###############################################

[global]

e2dsa
e2ts


[accounts]

alice: change-this-password
bob: change-this-password
charlie: change-this-password
admin: change-this-password


[groups]

## Users who belong to the family group.
family: alice, bob

## Users who belong to the staff group.
staff: charlie, admin


[/]

## Main shared storage.
/w

accs:
  ## Everyone can browse/download.
  r: *

  ## Family members can upload/modify/delete.
  rwmd: @family

  ## Administrators have full access.
  rwmda: @staff

flags:
  e2ds


[/private]

## Private files.
/w/private

accs:

## Only Alice and Bob can access this area.
rwmd: @family

## Administrators can access it too.
rwmda: @staff


[/upload]

## Public drop box.
/w/upload

accs:
  ## Anyone can upload.
  w: *

  ## Administrators can manage uploads.
  rwmda: @staff

flags:
  e2d
  nodupe
