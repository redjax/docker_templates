---
name: chaptarr

services:
  chaptarr:
    image: chaptarr/chaptarr:${CHAPTARR_IMG_TAG:-latest}
    container_name: chaptarr
    restart: unless-stopped
    cpus: ${CHAPTARR_CPUS:-2.0}
    mem_limit: ${CHAPTARR_MEMORY:-2g}
    ports:
      - ${CHAPTARR_HTTP_PORT:-8789}:8789
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      ## If ./config doesn't exist, Docker will create it as root:root.
      #  Create it first (or fix ownership) so it matches PUID/PGID.
      - ${CHAPTARR_CONFIG_DIR:-./data/config}:/config
      - ${CHAPTARR_AUDIOBOOKS_DIR:-./data/audiobooks}:/audiobooks
      - ${CHAPTARR_EBOOKS_DIR:-./data/ebooks}:/ebooks
      - ${CHAPTARR_DOWNLOADS_DIR:-./data/downloads}:/downloads
