---
#####################################################################
# Local Gluetun VPN definition                                      #
#                                                                   #
# This file is gitignored because each instance of this stack       #
# may have a different configuration. Some may run LazyLibrarian,   #
# others might only run the main compose.yml and the Gluetun layer. #
#                                                                   #
# You can define your forwarded ports and networked services using  #
# this file. Add it to your compose command like:                   #
#   docker compose \                                                #
#     -f compose.yml \                                              #
#     -f overlays/gluetun.yml \                                     #
#     -f overlays/gluetun-networks.yml \                            #
#     up \                                                          #
#     -d                                                            #
#                                                                   #
# Copy this file and use the comments to create your own network.   #
# Note that you must still run -f overlays/gluetun.yml with this.   #
#####################################################################

services:
  gluetun:
    ports:
      ########################################################
      # Forward ports to other containers running on Gluetun #
      #                                                      #
      # This allows serving the webUI over regular network,  #
      # and using VPN for jackett/torrent client traffic.    #
      ########################################################

      ## Comment/delete any service you are not using, i.e.
      #  with a -f overlays/<servicename>.yml
      - "${TRANSMISSION_WEB_PORT:-9091}:9091"
      - "${SONARR_PORT:-8989}:8989"
      - "${JACKETT_PORT:-9117}:9117"
      - "${RADARR_PORT:-7878}:7878"
      - "${BAZARR_PORT:-6767}:6767"
      - "${LAZY_LIB_PORT:-5299}:5299"
      - "${CHAPTARR_HTTP_PORT:-8789}:8789"

      ## FlareSolverr API
      - "8191:8191"

  ## Route service (-f overlays/<service-name>.yml) traffic
  #  through gluetun network.
  transmission:
    network_mode: "service:gluetun"
  sonarr:
    network_mode: "service:gluetun"
  jackett:
    network_mode: "service:gluetun"
  radarr:
    network_mode: "service:gluetun"
  bazarr:
    network_mode: "service:gluetun"
  lazylibrarian:
    network_mode: "service:gluetun"
  chaptarr:
    network_mode: "service:gluetun"
