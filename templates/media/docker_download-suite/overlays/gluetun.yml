---
####################################################################
# Check overlays/example.gluetun-networks.yml before running this. #
####################################################################

networks:
  media-net:
    external: false

services:
  gluetun:
    image: gmcgaw/gluetun:${GLUETUN_IMG_TAG:-latest}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${GLUETUN_VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${GLUETUN_VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${GLUETUN_WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${GLUETUN_WIREGUARD_ADDRESSES}
      TZ: ${TZ:-Etc/UTC}
    networks:
      - media-net
