---
####################################################################
# Gluetun - OpenVPN                                                #
#                                                                  #
# Check overlays/example.gluetun-networks.yml before running this. #
####################################################################

# networks:
#   media-net:
#     external: false

services:
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_IMG_TAG:-latest}
    container_name: ${GLUETUN_NAME:-gluetun}
    restart: ${GLUETUN_RESTART:-unless-stopped}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: ${GLUETUN_OPENVPN_CONFIG}
      TZ: ${TZ:-Etc/UTC}
      FIREWALL_OUTBOUND_SUBNETS: "${FIREWALL_OUTBOUND_SUBNETS}"
    volumes:
      - ${GLUETUN_OPENVPN_DIR:-./apps/gluetun/openvpn}:/gluetun:ro
    # networks:
    #   - media-net
