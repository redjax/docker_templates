---
name: defect-dojo

volumes:
  defectdojo_media: {}

services:
  nginx:
    image: "${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-nginx:${NGINX_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "${NGINX_METRICS_ENABLED:-false}"
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    ports:
      - "${DD_PORT:-8080}:8080"
      - "${DD_TLS_PORT:-8443}:8443"
    volumes:
      - ${DD_MEDIA_DIR:-defectdojo_media}:/usr/share/nginx/html/media

  uwsgi:
    image: "${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DJANGO_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      initializer:
        condition: service_completed_successfully
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - -t
      - "30"
      - --
      - /entrypoint-uwsgi.sh
    environment:
      DD_DEBUG: "False"
      DD_DJANGO_METRICS_ENABLED: "${DD_DJANGO_METRICS_ENABLED:-False}"
      DD_ALLOWED_HOSTS: "${DD_ALLOWED_HOSTS:-*}"
      DD_DATABASE_URL: "${DD_DATABASE_URL:-postgresql://${DD_DATABASE_USER:-defectdojo}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@postgres:5432/${DD_DATABASE_NAME:-defectdojo}}"
      DD_CELERY_BROKER_URL: "${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}"
      DD_CACHE_URL: "${DD_CACHE_URL:-redis://valkey:6379/1}"
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
    volumes:
      - ${DD_EXTRA_SETTINGS_DIR:-./docker/extra_settings}:/app/docker/extra_settings:ro
      - ${DD_MEDIA_DIR:-defectdojo_media}:/app/media

  celeryworker:
    image: "${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DJANGO_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      initializer:
        condition: service_completed_successfully
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - -t
      - "30"
      - --
      - /entrypoint-celery-worker.sh
    environment:
      DD_DATABASE_URL: "${DD_DATABASE_URL:-postgresql://${DD_DATABASE_USER:-defectdojo}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@postgres:5432/${DD_DATABASE_NAME:-defectdojo}}"
      DD_CELERY_BROKER_URL: "${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}"
      DD_CACHE_URL: "${DD_CACHE_URL:-redis://valkey:6379/1}"
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
    volumes:
      - ./docker/extra_settings:/app/docker/extra_settings:ro
      - defectdojo_media:/app/media

  celerybeat:
    image: "${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DJANGO_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      initializer:
        condition: service_completed_successfully
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - -t
      - "30"
      - --
      - /entrypoint-celery-beat.sh
    environment:
      DD_DATABASE_URL: "${DD_DATABASE_URL:-postgresql://${DD_DATABASE_USER:-defectdojo}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@postgres:5432/${DD_DATABASE_NAME:-defectdojo}}"
      DD_CELERY_BROKER_URL: "${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}"
      DD_CACHE_URL: "${DD_CACHE_URL:-redis://valkey:6379/1}"
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
    volumes:
      - ${DD_EXTRA_SETTINGS_DIR:-./docker/extra_settings}:/app/docker/extra_settings:ro

  initializer:
    image: "${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DJANGO_VERSION:-latest}"
    restart: "no"
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - --
      - /entrypoint-initializer.sh
    environment:
      DD_DATABASE_URL: "${DD_DATABASE_URL:-postgresql://${DD_DATABASE_USER:-defectdojo}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@postgres:5432/${DD_DATABASE_NAME:-defectdojo}}"
      DD_ADMIN_USER: "${DD_ADMIN_USER:-admin}"
      DD_ADMIN_MAIL: "${DD_ADMIN_MAIL:-admin@defectdojo.local}"
      DD_ADMIN_FIRST_NAME: "${DD_ADMIN_FIRST_NAME:-Admin}"
      DD_ADMIN_LAST_NAME: "${DD_ADMIN_LAST_NAME:-User}"
      DD_INITIALIZE: "${DD_INITIALIZE:-true}"
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-30}"
    volumes:
      - ${DD_EXTRA_SETTINGS_DIR:-./docker/extra_settings}:/app/docker/extra_settings:ro
