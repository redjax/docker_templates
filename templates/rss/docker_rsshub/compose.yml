---
networks:
  rsshub_net: {}

volumes:
  rsshub_redis_data: {}

services:
  rsshub:
    image: diygod/rsshub
    container_name: rsshub
    restart: unless-stopped
    ports:
      - ${RSSHUB_WEBUI_PORT:-1200}:1200
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://redis:6379/"
      PUPPETEER_WS_ENDPOINT: "ws://browserless:3000"
    depends_on:
      - redis
      - browserless
    networks:
      - rsshub_net

  browserless:
    image: browserless/chrome
    restart: always
    ulimits:
      core:
        hard: 0
        soft: 0
    networks:
      - rsshub_net

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ${RSSHUB_REDIS_DATA_DIR:-rsshub_redis_data}:/data
    networks:
      - rsshub_net
