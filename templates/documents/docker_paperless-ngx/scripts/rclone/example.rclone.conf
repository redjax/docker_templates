## Don't edit this file directly. Use:
#    rclone config --config path/to/rclone.conf
[wasabi]
type = s3
provider = Wasabi
## Create an access key in the webUI before using this config.
#  Make sure the user has access to the bucket(s) you target.
access_key_id = <YOUR WASABI ACCESS KEY ID>
secret_access_key = <YOUR WASABI SECRET ACCESS KEY>
endpoint = s3.wasabisys.com
