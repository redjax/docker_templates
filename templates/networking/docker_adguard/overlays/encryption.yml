---
#################################################################################
# Add Docker configurations required for enabling encryption in the AdGuard UI. #
#################################################################################

services:
  adguardhome:
    volumes:
      - ${ADGUARD_CERT_FILE:-./certs/adguard.crt}:/certs/adguard.crt:ro
      - ${ADGUARD_CERT_KEY:-./certs/adguard.key}:/certs/adguard.key:ro
    ports:
      # DNS-over-TLS
      - 853:853/tcp
      # DNS-over-QUIC
      - 784:784/udp
      - 853:853/udp
      - 8853:8853/udp
      # DNSCrypt
      - 5443:5443/tcp
      - 5443:5443/udp