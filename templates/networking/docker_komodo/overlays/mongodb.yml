---
volumes:
  mongo-data: {}
  mongo-config: {}

services:
  mongo:
    image: mongo:${MONGODB_IMG_TAG:-9}
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    labels:
      komodo.skip:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:-komodo}
    volumes:
      - ${MONGODB_DATA_DIR:-mongo-data}:/data/db
      - ${MONGODB_CONFIG_DIR:-mongo-config}:/data/configdb

  core:
    depends_on:
      - mongo
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017

