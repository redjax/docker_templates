---
volumes:
  caddy-data: {}
  caddy-config: {}

services:
  caddy:
    image: caddy:${CADDY_IMG_TAG:-2}
    restart: unless-stopped
    ports:
      - ${CADDY_HTTP_PORT:-80}:80
      - ${CADDY_HTTPS_PORT:-443}:443
    environment:
      KOMODO_TLS_NAMES: ${KOMODO_TLS_NAMES:?Set KOMODO_TLS_NAMES in .env}
      KOMODO_DEFAULT_SNI: ${KOMODO_DEFAULT_SNI:?Set KOMODO_DEFAULT_SNI in .env}
    volumes:
      - ${CADDY_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-caddy-data}:/data
      - ${CADDY_CONFIG_DIR:-caddy-config}:/config

  core:
    ## Replace host port mapping from main compose.yml
    ports: !override []
    expose:
      - "9120"
