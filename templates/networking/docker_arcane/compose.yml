---
name: arcane

volumes:
  arcane-data: {}

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:${ARCANE_IMG_TAG:-latest}
    restart: unless-stopped
    cgroup: host
    ports:
      - "${ARCANE_PORT:-0.0.0.0:3552}:3552"
    environment:
      TZ: ${ARCANE_TZ:-Etc/UTC}
      LOG_LEVEL: ${ARCANE_LOG_LEVEL:-info}
      LOG_JSON: ${ARCANE_LOG_JSON:-false}
      ANALYTICS_DISABLED: ${ARCANE_ANALYTICS_DISABLED:-true}
      PROJECT_SCAN_MAX_DEPTH: ${ARCANE_PROJECT_SCAN_MAX_DEPTH:-3}
      APP_URL: "${ARCANE_APP_URL:?Set ARCANE_APP_URL in .env}"
      ENCRYPTION_KEY: "${ARCANE_ENCRYPTION_KEY:?Set ARCANE_ENCRYPTION_KEY in .env}"
      PUID: "${ARCANE_PUID:-1000}"
      PGID: "${ARCANE_PGID:-1000}"
      PROJECTS_DIRECTORY: "${ARCANE_PROJECTS_DIRECTORY:-/opt/docker}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ARCANE_DATA_DIR:-arcane-data}:/app/data
      - "${ARCANE_PROJECTS_DIRECTORY:-/opt/docker}:${ARCANE_PROJECTS_DIRECTORY:-/opt/docker}"
    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

