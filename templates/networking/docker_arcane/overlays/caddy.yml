---
volumes:
  caddy-data: {}
  caddy-config: {}

services:
  caddy:
    image: "caddy:${CADDY_IMG_TAG:-2}"
    restart: unless-stopped
    depends_on:
      - arcane
    environment:
      CADDY_HOST: "${CADDY_HOST:?Set CADDY_HOST in .env}"
      CADDY_HTTPS_PORT: "${CADDY_HTTPS_PORT:-443}"
      CADDY_TLS_ISSUER: "${CADDY_TLS_ISSUER:-internal}"
    ports:
      - "${CADDY_HTTP_PORT:-80}:80/tcp"
      - "${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}/tcp"
      - "${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}/udp"
    volumes:
      - ${CADDY_CADDYFILE:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-caddy-data}:/data
      - ${CADDY_CONFIG_DIR:-caddy-config}:/config

  arcane:
    ## Remove ALL host port publishing from the base Compose file.
    ports: !reset []
    environment:
      ## Override the base APP_URL with the browser-facing HTTPS URL.
      APP_URL: "${ARCANE_HTTPS_URL:?Set ARCANE_HTTPS_URL in .env}"
