---
name: unifi

volumes:
  syslog-data: {}

services:
  rsyslog-collector:
    image: rsyslog/rsyslog-collector:latest
    restart: unless-stopped
    environment:
      - ENABLE_UDP=${SYSLOG_ENABLE_UDP:-on}
      - ENABLE_TCP=${SYSLOG_ENABLE_TCP:-off}
      - ENABLE_RELP=${SYSLOG_ENABLE_RELP:-off}
      - ENABLE_TLS=${SYSLOG_ENABLE_TLS:-off}
      - TZ=${TZ:-Etc/UTC}
    ports:
      - ${SYSLOG_PORT:-514}:514/udp
    volumes:
      - ${SYSLOG_DATA_DIR:-syslog-data}:/var/log
      - ${SYSLOG_CONFIG_DIR:-./config/rsyslog.d}:/etc/rsyslog.d:ro

  logrotate:
    image: alpine:latest
    restart: unless-stopped
    depends_on:
      - rsyslog-collector
    pid: "service:rsyslog-collector"
    volumes:
      - ${SYSLOG_DATA_DIR:-syslog-data}:/var/log
    command:
      - /bin/sh
      - -ec
      - |
        MAX_SIZE=52428800

        while true; do
          for f in /var/log/*.log; do
            [ -f "$$f" ] || continue

            size=$$(stat -c%s "$$f")

            if [ "$$size" -gt "$$MAX_SIZE" ]; then
              echo "Rotating $$f ($$size bytes)"

              mv -f "$$f" "$$f.1"

              # rsyslog is PID 1 in the shared PID namespace.
              # Close the old outputs; reopen on the next message.
              kill -HUP 1
            fi
          done

          sleep 60
        done

