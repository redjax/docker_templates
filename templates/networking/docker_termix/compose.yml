---
# networks:
#   unnamed_net: {}

volumes:
  termix_data:
    driver: local

services:
  termix:
    image: ghcr.io/lukegus/termix:${TERMIX_IMG_TAG:-latest}
    container_name: termix
    restart: unless-stopped
    ports:
      - ${TERMIX_HTTP_PORT:-8080}:8080
    volumes:
      - ${TERMIX_DATA_DIR:-termix_data}:/app/data
    environment:
      PORT: 8080
      OIDC_SILENT_LOGIN_DEFAULT: ${TERMIX_OIDC_SILENT_LOGIN_DEFAULT:-false}
      ALLOW_PASSWORD_LOGIN: ${TERMIX_ALLOW_PASSWORD_LOGIN:-true}
