---
volumes:
  mysql_data: {}

services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-managemydamnlife}
      DB_USER: ${DB_USER:-mmdl}
      DB_PASS: ${DB_PASS:-managemydamnlife}

  db:
    image: mysql:${MYSQL_IMG_TAG:-8.0}
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-managemydamnlife}
      MYSQL_USER: ${DB_USER:-mmdl}
      MYSQL_PASSWORD: ${DB_PASS:-managemydamnlife}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-managemydamnlife}
    volumes:
      - ${DB_DATA_DIR:-mysql_data}:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
