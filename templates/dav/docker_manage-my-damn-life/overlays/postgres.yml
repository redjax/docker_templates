---
volumes:
  postgres_data: {}

services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-managemydamnlife}
      DB_USER: ${DB_USER:-mmdl}
      DB_PASS: ${DB_PASS:-managemydamnlife}

  db:
    image: postgres:${POSTGRES_IMG_TAG:-16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-managemydamnlife}
      POSTGRES_USER: ${DB_USER:-mmdl}
      POSTGRES_PASSWORD: ${DB_PASS:-managemydamnlife}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
